# Бот + локальный сервер Telegram Bot API (файлы до 2 ГБ вместо 20 МБ).
# Нужны TELEGRAM_API_ID / TELEGRAM_API_HASH с https://my.telegram.org и токен бота — см. .env.example.
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      # Бот читает скачанные файлы прямо с диска — путь в обоих контейнерах одинаковый
      - tg-bot-api:/var/lib/telegram-bot-api

  bot:
    build:
      context: .
      args:
        EXTRAS: "[speech]"
    restart: unless-stopped
    env_file: .env
    environment:
      REELS_TELEGRAM_API_BASE: http://telegram-bot-api:8081
      REELS_DATA_DIR: /data
    volumes:
      - reels-data:/data
      - tg-bot-api:/var/lib/telegram-bot-api
      - ./assets/music:/app/assets/music:ro
    depends_on:
      - telegram-bot-api

volumes:
  tg-bot-api:
  reels-data:
